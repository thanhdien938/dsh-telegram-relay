name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pytest-asyncio mcp jsonschema

      - name: Run relay test suite
        env:
          PYTHONPATH: relay
          DSH_RELAY_ALLOWED_GITHUB_USERS: test-user,alice
          DSH_RELAY_TELEGRAM_TARGET: dsh_test_bot
        run: |
          pytest -v relay
